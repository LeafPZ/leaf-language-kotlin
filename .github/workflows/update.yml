name: Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Java
        # v6
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: 25
          distribution: 'temurin'
          cache: gradle
      - run: ./gradlew updateVersions processTemplates -x test -Pleaf.loom.minimalSetup=true
      - name: Generate App Token
        id: generate-app-token
        # v3.2.0
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.PR_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PR_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Create Pull Request
        # v8
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          branch: chore/update-kotlin-deps
          title: 'chore: update kotlin deps'
          author: leafpz-pr-bot[bot] <340829636+leafpz-pr-bot[bot]@users.noreply.github.com>
          commit-message: Update kotlin deps
          token: ${{ steps.generate-app-token.outputs.token }}
