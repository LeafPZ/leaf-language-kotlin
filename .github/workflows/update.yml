name: Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Java
        # v6
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: 25
          distribution: 'temurin'
          cache: gradle
      - run: ./gradlew updateVersions -x test -Pleaf.loom.minimalSetup=true
      - run: ./gradlew processTemplates -x test -Pleaf.loom.minimalSetup=true
      - name: Create Pull Request
        # v8
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          branch: update-versions
          title: Update versions
          author: github-actions <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: Update versions
